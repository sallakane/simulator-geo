# Chargé automatiquement en développement. Contient ce qui ne doit JAMAIS
# exister en production : ports ouverts sur le poste, faux serveur SMTP, outils.
services:
  database:
    ports:
      # 5435 : 5432 est souvent pris par un Postgres local, 5434 par
      # maisonbrute-app sur le même poste (SPEC §12).
      - "127.0.0.1:${DB_HOST_PORT:-5435}:5432"

  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1028}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8028}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Outillage géospatial : inspection du shapefile (SPEC §4.1) ET chargement
  # dans PostGIS (§4.2), via bin/charger-rga.sh. Profil `tools` = jamais démarré
  # par `make up`.
  #
  # Version FIGÉE : le tag `latest` de cette image est une compilation
  # quotidienne. Un pipeline de données qui change de version de GDAL sans
  # qu'on le décide n'est plus rejouable (§4.4).
  gis:
    image: ghcr.io/osgeo/gdal:alpine-small-3.11.0
    profiles: ["tools"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zonage}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - ./data:/data:ro
    command: ["ogrinfo", "--version"]

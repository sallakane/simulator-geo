; Prod — opcache figé. La promesse du produit est une réponse immédiate
; (SPEC §3) : le temps passé à revalider des fichiers qui ne changent jamais
; entre deux déploiements est du temps perdu.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
realpath_cache_size = 4096K
realpath_cache_ttl = 600

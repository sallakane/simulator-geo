expose_php = 0
; Les horodatages sont stockés en UTC (le VPS tourne en UTC) et convertis à
; l'affichage. Ne pas mettre Europe/Paris ici.
date.timezone = UTC
short_open_tag = 0
session.use_strict_mode = 1
apc.enable_cli = 1

; L'API ne reçoit que du JSON de quelques kilo-octets.
upload_max_filesize = 2M
post_max_size = 2M
memory_limit = 256M
